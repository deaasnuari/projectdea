services:
  db:
    image: postgres:16-alpine
    container_name: lazispln-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lazispln
      POSTGRES_PASSWORD: lazispln
      POSTGRES_DB: lazispln
    ports:
      - "5432:5432"
    volumes:
      - lazispln_pgdata:/var/lib/postgresql/data

volumes:
  lazispln_pgdata:
