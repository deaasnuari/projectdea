# Pengaturan Locust dengan tampilan web langsung berjalan (tanpa mengisi form).
# Jalankan dari folder utama proyek:
#   python -m locust --config loadtest/locust.conf
# lalu buka http://localhost:8089
locustfile = loadtest/locustfile.py
web-port = 8089

# Mulai otomatis begitu halaman web dibuka
autostart = true
users = 30
spawn-rate = 5
run-time = 3m
